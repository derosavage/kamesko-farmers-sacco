######################## Success story #############################
success_story:
  enable : true
  bg_image : "images/backgrounds/success-story.jpg"
  title : "Shared Prosperity, Real Impact"
  content : "Kamesko Sacco rewards its members through attractive dividends and interest on savings. We provide linkages with participating partners, giving you access to more opportunities and value through our trusted partnerships. We reinvest in you and our community through member empowerment. Your success is our success. Together, we build wealth that lasts."
  # video link
  video_link : "https://www.youtube.com/watch?v=ResipmZmpDU"


