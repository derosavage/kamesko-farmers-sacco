######################## Success story #############################
success_story:
  enable : true
  bg_image : "images/backgrounds/success-story.jpg"
  title : "Prospérité partagée, impact réel"
  content : "Kamesko Sacco récompense ses membres avec des dividendes attrayants et des intérêts sur les économies. Nous offrons des liens avec des partenaires participants, vous donnant accès à plus d'opportunités et de valeur grâce à nos partenariats de confiance. Nous réinvestissons en vous et dans notre communauté. Votre succès est notre succès. Ensemble, nous bâtissons une richesse durable."
  # video link
  video_link : "https://www.youtube.com/watch?v=ResipmZmpDU"


